version: '3.8'

services:
  app:
    build: .
    container_name: attendance-engine
    ports:
      - '8080:8080'
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - attendance-network

  redis:
    image: redis:7-alpine
    container_name: attendance-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - attendance-network

volumes:
  redis-data:

networks:
  attendance-network:
    driver: bridge
